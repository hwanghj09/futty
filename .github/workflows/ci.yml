name: CI

on: [push, pull_request]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Verify prototype art, animated GLB and WAV generator
        run: python -m unittest discover -s scripts -p test_prototype_asset_pack.py
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Verify generated PNG, animated GLB and WAV imports in Futty
        run: cargo test --locked -p futty-mcp generated_prototype_assets_import_through_futty -- --ignored
      - run: cargo build --locked --workspace --release
      - name: Upload Windows editor
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: futty-editor-windows-x64
          path: target/release/futty-editor.exe
          if-no-files-found: error
